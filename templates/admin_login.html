{% extends 'base.html' %}

{% block title %}Login Administrador{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Panel Administrador
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input
                            type="text"
                            name="usuario"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>
                    </div>

                    <button class="btn btn-success w-100">
                        Ingresar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
