{% extends 'base.html' %}

{% block title %}Nuevo Cliente{% endblock %}

{% block content %}

<h1 class="mb-4">
    Nuevo Cliente
</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">
            Nombre y Apellido
        </label>

        <input
            type="text"
            name="nombre"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">
            DNI
        </label>

        <input
            type="text"
            name="dni"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">
            Teléfono
        </label>

        <input
            type="text"
            name="telefono"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">
            Fecha de Nacimiento
        </label>

        <input
            type="date"
            name="fecha_nacimiento"
            class="form-control">
    </div>

    <button
        type="submit"
        class="btn btn-primary">
        Guardar Cliente
    </button>

</form>

{% endblock %}
